name: Legacy backend parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: legacy-backend-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.select.outputs.full }}
      mode: ${{ steps.select.outputs.mode }}
      run_acceptance: ${{ steps.select.outputs.run_acceptance }}
      matrix_acceptance: ${{ steps.select.outputs.matrix_acceptance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify CI selection and documentation
        run: |
          node --test .github/ci/change-scope.test.mjs
          node scripts/check-docs.mjs
      - name: Select required runtime checks
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ci/change-scope.mjs

  acceptance:
    needs: scope
    if: ${{ needs.scope.outputs.run_acceptance == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.scope.outputs.matrix_acceptance) }}
    env:
      AI_GATEWAY_API_KEY: ''
      VERCEL_OIDC_TOKEN: ''
      CONTEXT_API_KEY: ''
      CONTEXT_DEV_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
      TSX_DISABLE_CACHE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - run: npm run retrieval:prepare -- --offline
      - name: Install CLI WebKit
        if: matrix.gate != 'domains'
        run: npx playwright install --with-deps webkit
      - name: Validate 018 design artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/018-legacy-backend-parity
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Domain, cache, source, journey, operations and upload regressions
        if: matrix.gate == 'domains'
        run: node scripts/check-legacy-parity-disposable.mjs
      - name: Actual four-project WebKit acceptance
        if: matrix.gate == 'webkit'
        run: node scripts/check-legacy-parity-disposable.mjs --webkit
      - name: Actual unpaid native operations, staged files, checklist and questions
        if: startsWith(matrix.gate, 'native-')
        run: node scripts/check-legacy-parity-disposable.mjs --${{ matrix.gate }}

      - name: Retain owned runtime failure diagnostics
        if: failure() && startsWith(matrix.gate, 'native-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-runtime-${{ matrix.gate }}-${{ github.run_id }}
          path: |
            local-artifacts/legacy-parity-native-files/failure-private.json
            local-artifacts/legacy-parity-native-files/failure-page-private.png
            local-artifacts/legacy-parity-native-files/runtime-state-private.json
            local-artifacts/legacy-parity-native-files/workflow-*-private.json
            local-artifacts/018/ci-disposable/*-query-observation-validated-private.json
            local-artifacts/ordinary-operations-native/failure-private.json
            local-artifacts/ordinary-operations-native/failure-*-messages.json
            local-artifacts/ordinary-operations-native/database-failure-private.json
            local-artifacts/ordinary-operations-native/failure-*.png
            local-artifacts/ordinary-operations-native/failure-*.txt
          if-no-files-found: warn
          retention-days: 1

  ci-result:
    if: always()
    needs: [scope, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check or verified scope decision
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const needs=JSON.parse(process.env.RESULTS);
          if(needs.scope?.result!=='success')throw Error('CI selection did not succeed');
          const mode=needs.scope.outputs.mode;
          if(!['full','ui','none'].includes(mode))throw Error('Missing explicit CI scope');
          for(const [name,job] of Object.entries(needs)){
            if(name==='scope')continue;
            const selected=needs.scope.outputs['run_'+name.replaceAll('-','_')];
            if(!['true','false'].includes(selected))throw Error('Unmapped CI job: '+name);
            if(job.result!==(selected==='true'?'success':'skipped'))throw Error('Required check did not succeed: '+name);
          }
          console.log('All checks selected for '+mode+' passed. See CI Scope for original execution provenance.');
          JS
