name: Turas checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Owned UI clones reuse module paths across disposable roots; do not reuse
  # cached TSX transforms from another root during startup.
  TSX_DISABLE_CACHE: '1'

concurrency:
  group: turas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        gate: [deterministic, native, recovery, benchmark, evaluation-fixture, regressions, webkit]
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      TURAS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      TURAS_ENVIRONMENT_ID: test-ci-expansion
      TURAS_TEST_ENVIRONMENT_ID: test-ci-expansion
      TURAS_APP_ORIGIN: http://127.0.0.1:3000
      TURAS_DEMO_USERNAME: mcteer
      PANEL_USERNAME: panel
      PARTNER_USERNAME: partner
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Create private synthetic credentials
        run: |
          for key in TURAS_DEMO_PASSWORD PANEL_PASSWORD PARTNER_PASSWORD TURAS_MAINTENANCE_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo "TURAS_ARTIFACT_STORE_ROOT=${GITHUB_WORKSPACE}/local-artifacts/011/source-store" >> "$GITHUB_ENV"
      - name: Initialize marked disposable source
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE turas_test_011_source'
          psql -h 127.0.0.1 -U postgres -c 'CREATE ROLE turas_runtime NOLOGIN'
          npm run db:init
          npm run db:roles
          mkdir -p "$TURAS_ARTIFACT_STORE_ROOT"
          chmod 700 "$TURAS_ARTIFACT_STORE_ROOT"
          node --input-type=module -e 'import {writeFileSync} from "node:fs";writeFileSync(`${process.env.TURAS_ARTIFACT_STORE_ROOT}/.turas-artifact-store.json`,JSON.stringify({environmentId:process.env.TURAS_ENVIRONMENT_ID}),{mode:0o600});'
      - name: Separate application placeholders from the marked test source
        run: |
          echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/turas_expansion_app_not_selected" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=postgres://postgres:postgres@127.0.0.1:5432/turas_expansion_app_not_selected" >> "$GITHUB_ENV"
      - name: Validate feature 011 artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/011-product-expansion
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Complete expansion domain and contract suites
        if: matrix.gate == 'deterministic'
        run: |
          npm run typecheck:expansion
          npm run test:expansion
      - name: Actual framework and interrupted recovery with deterministic provider
        if: matrix.gate == 'native'
        run: |
          npm run expansion:native:check
          npm run expansion:native:check -- --interrupted
      - name: Empty and 045 upgrade, privileges and preserved owned restarts
        if: matrix.gate == 'recovery'
        run: npm run expansion:recovery:check
      - name: Representative expansion performance corpus
        if: matrix.gate == 'benchmark'
        run: npm run benchmark:expansion
      - name: Live-capture runner guard fixture without configured-provider calls
        if: matrix.gate == 'evaluation-fixture'
        run: npm run eval:expansion -- --fixture
      - name: Governed earlier privacy, research, plan, execution and support regressions
        if: matrix.gate == 'regressions'
        run: npm run test:expansion:regressions
      - name: Install WebKit
        if: matrix.gate == 'webkit'
        run: npx playwright install --with-deps webkit
      - name: Complete expansion journeys across four WebKit projects
        if: matrix.gate == 'webkit'
        run: npm run expansion:ui:check

  support-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        gate: [deterministic, webkit]
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_support
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@127.0.0.1:5432/turas_test_support
      TURAS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_support
      TURAS_ENVIRONMENT_ID: test-ci-support
      TURAS_TEST_ENVIRONMENT_ID: test-ci-support
      TURAS_APP_ORIGIN: http://127.0.0.1:3000
      TURAS_DEMO_USERNAME: mcteer
      PANEL_USERNAME: panel
      PARTNER_USERNAME: partner
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Create private synthetic credentials
        run: |
          for key in TURAS_DEMO_PASSWORD PANEL_PASSWORD PARTNER_PASSWORD TURAS_MAINTENANCE_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo "TURAS_ARTIFACT_STORE_ROOT=${GITHUB_WORKSPACE}/local-artifacts/010/source-store" >> "$GITHUB_ENV"
      - name: Initialize marked disposable source
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE turas_test_support'
          psql -h 127.0.0.1 -U postgres -c 'CREATE ROLE turas_runtime NOLOGIN'
          npm run db:init
          npm run db:roles
          mkdir -p "$TURAS_ARTIFACT_STORE_ROOT"
          chmod 700 "$TURAS_ARTIFACT_STORE_ROOT"
          node --input-type=module -e 'import {writeFileSync} from "node:fs";writeFileSync(`${process.env.TURAS_ARTIFACT_STORE_ROOT}/.turas-artifact-store.json`,JSON.stringify({environmentId:process.env.TURAS_ENVIRONMENT_ID}),{mode:0o600});'
      - name: Separate application placeholders from the marked test source
        run: |
          echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/turas_support_app_not_selected" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=postgres://postgres:postgres@127.0.0.1:5432/turas_support_app_not_selected" >> "$GITHUB_ENV"
      - name: Test every support suite on owned disposable clones
        if: matrix.gate == 'deterministic'
        run: npm run test:support
      - name: Check governed support dispatch through the actual framework
        if: matrix.gate == 'deterministic'
        run: npm run support:native:check
      - name: Check interrupted support dispatch and same-key replay
        if: matrix.gate == 'deterministic'
        run: npm run support:native:check -- --interrupted
      - name: Check preserved support database and workflow restart
        if: matrix.gate == 'deterministic'
        run: npm run support:recovery:check -- --disposable
      - name: Install WebKit
        if: matrix.gate == 'webkit'
        run: npx playwright install --with-deps webkit
      - name: Exercise every support journey in four WebKit projects
        if: matrix.gate == 'webkit'
        run: npm run support:ui:check

  reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gate: [deterministic, regressions, webkit]
    env:
      TURAS_APP_ORIGIN: http://127.0.0.1:3000
      TURAS_DEMO_USERNAME: mcteer
      PANEL_USERNAME: panel
      PARTNER_USERNAME: partner
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
      TURAS_REPORT_DELIVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Create private disposable reporting credentials
        run: |
          for key in TURAS_DEMO_PASSWORD PANEL_PASSWORD PARTNER_PASSWORD TURAS_MAINTENANCE_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Build isolated report renderer
        if: matrix.gate != 'regressions'
        run: docker build --file report-renderer/Dockerfile --tag turas-report-renderer:009-executive-v1 .
      - name: Install host artifact validators
        if: matrix.gate != 'regressions'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Install WebKit
        if: matrix.gate == 'webkit'
        run: npx playwright install --with-deps webkit
      - name: Test reporting on owned disposable Postgres and private stores
        if: matrix.gate == 'deterministic'
        run: npm run test:reports
      - name: Check previous features without model calls
        if: matrix.gate == 'regressions'
        run: npm run test:reports:regressions
      - name: Exercise reporting in four WebKit projects
        if: matrix.gate == 'webkit'
        run: npm run reports:ui:check

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify pinned vector image
        run: npm run retrieval:prepare -- --offline
      - run: npm ci --prefix packages/artifact-extractor
      - name: Create isolated test configuration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE turas_ci'
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE turas_test'
          runtime_password="$(openssl rand -hex 24)"
          demo_password="$(openssl rand -hex 20)"
          panel_password="$(openssl rand -hex 20)"
          partner_password="$(openssl rand -hex 20)"
          maintenance_secret="$(openssl rand -hex 32)"
          for value in "$runtime_password" "$demo_password" "$panel_password" "$partner_password" "$maintenance_secret"; do
            echo "::add-mask::$value"
          done
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE turas_runtime LOGIN PASSWORD '${runtime_password}'"
          {
            echo "DATABASE_URL=postgres://turas_runtime:${runtime_password}@127.0.0.1:5432/turas_ci"
            echo 'DATABASE_URL_UNPOOLED=postgres://postgres:postgres@127.0.0.1:5432/turas_ci'
            echo 'TURAS_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/turas_test'
            echo 'TURAS_ENVIRONMENT_ID=ci-002'
            echo 'TURAS_TEST_ENVIRONMENT_ID=test-ci-002'
            echo 'TURAS_APP_ORIGIN=http://127.0.0.1:3000'
            echo 'TURAS_DEMO_USERNAME=mcteer'
            echo 'PANEL_USERNAME=panel'
            echo 'PARTNER_USERNAME=partner'
            echo "TURAS_DEMO_PASSWORD=$demo_password"
            echo "PANEL_PASSWORD=$panel_password"
            echo "PARTNER_PASSWORD=$partner_password"
            echo "TURAS_MAINTENANCE_SECRET=$maintenance_secret"
          } >> "$GITHUB_ENV"
      - name: Initialize disposable databases
        run: |
          npm run db:init
          npm run db:roles
          npm run db:bootstrap-demo
          DATABASE_URL_UNPOOLED="${TURAS_TEST_DATABASE_URL}" TURAS_ENVIRONMENT_ID="${TURAS_TEST_ENVIRONMENT_ID}" npm run db:init
          DATABASE_URL_UNPOOLED="${TURAS_TEST_DATABASE_URL}" TURAS_ENVIRONMENT_ID="${TURAS_TEST_ENVIRONMENT_ID}" npm run db:roles
          DATABASE_URL="${TURAS_TEST_DATABASE_URL}" TURAS_ENVIRONMENT_ID="${TURAS_TEST_ENVIRONMENT_ID}" npm run db:bootstrap-demo
      - name: Prepare isolated artifact fixtures and images
        run: |
          echo "TURAS_ARTIFACT_STORE_ROOT=${GITHUB_WORKSPACE}/local-artifacts/004/store" >> "$GITHUB_ENV"
          TURAS_ARTIFACT_STORE_ROOT="${GITHUB_WORKSPACE}/local-artifacts/004/store" npm run artifacts:prepare
          npm run artifacts:fixtures
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Discover versioned behavior cases without model calls
        run: npx eve eval --list
      - run: npm run test:integration
      - run: npm run test:contracts
      - run: npm run test:artifacts
      - name: Test governed retrieval and research on disposable Postgres
        run: npm run test:retrieval
      - name: Test delivery plans on an isolated disposable clone
        run: npm run test:plans
      - name: Test staffing with complete suite coverage on an owned disposable clone
        run: npm run test:staffing
      - name: Compile without sandbox preparation
        run: npm run build:check
      - name: Validate Spec Kit feature artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/004-chat-artifact-ingestion
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Validate feature 005 Spec Kit artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/005-governed-rag-research
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Validate feature 007 Spec Kit artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/007-skills-staffing
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Install WebKit
        run: |
          # The Azure package mirror stalled at roughly 50 KB/s in review CI.
          # Keep Ubuntu's suites and signing keys; use its primary HTTPS archive.
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          npx playwright install --with-deps webkit
      - name: Exercise the local UI in WebKit
        env:
          TURAS_UI_LEGACY_ONLY: '1'
        run: npm run test:ui
      - name: Exercise 005 UI on isolated disposable Postgres
        run: |
          DATABASE_URL="$TURAS_TEST_DATABASE_URL" \
          DATABASE_URL_UNPOOLED="$TURAS_TEST_DATABASE_URL" \
          TURAS_ENVIRONMENT_ID="$TURAS_TEST_ENVIRONMENT_ID" \
          TURAS_UI_FIXTURE_DATABASE_URL="$TURAS_TEST_DATABASE_URL" \
          TURAS_UI_BASE_URL="$TURAS_APP_ORIGIN" \
          npm run test:ui -- tests/ui/knowledge.spec.ts tests/ui/research.spec.ts tests/ui/retrieval.spec.ts

  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gate: [deterministic, regressions, webkit]
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify pinned vector image
        run: npm run retrieval:prepare -- --offline
      - run: npm ci --prefix packages/artifact-extractor
      - name: Create isolated test configuration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE turas_ci'
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE turas_test'
          runtime_password="$(openssl rand -hex 24)"
          demo_password="$(openssl rand -hex 20)"
          panel_password="$(openssl rand -hex 20)"
          partner_password="$(openssl rand -hex 20)"
          maintenance_secret="$(openssl rand -hex 32)"
          for value in "$runtime_password" "$demo_password" "$panel_password" "$partner_password" "$maintenance_secret"; do
            echo "::add-mask::$value"
          done
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE turas_runtime LOGIN PASSWORD '${runtime_password}'"
          {
            echo "DATABASE_URL=postgres://turas_runtime:${runtime_password}@127.0.0.1:5432/turas_ci"
            echo 'DATABASE_URL_UNPOOLED=postgres://postgres:postgres@127.0.0.1:5432/turas_ci'
            echo 'TURAS_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/turas_test'
            echo 'TURAS_ENVIRONMENT_ID=ci-002'
            echo 'TURAS_TEST_ENVIRONMENT_ID=test-ci-002'
            echo 'TURAS_APP_ORIGIN=http://127.0.0.1:3000'
            echo 'TURAS_DEMO_USERNAME=mcteer'
            echo 'PANEL_USERNAME=panel'
            echo 'PARTNER_USERNAME=partner'
            echo "TURAS_DEMO_PASSWORD=$demo_password"
            echo "PANEL_PASSWORD=$panel_password"
            echo "PARTNER_PASSWORD=$partner_password"
            echo "TURAS_MAINTENANCE_SECRET=$maintenance_secret"
          } >> "$GITHUB_ENV"
      - name: Initialize disposable databases
        run: |
          npm run db:init
          npm run db:roles
          npm run db:bootstrap-demo
          DATABASE_URL_UNPOOLED="${TURAS_TEST_DATABASE_URL}" TURAS_ENVIRONMENT_ID="${TURAS_TEST_ENVIRONMENT_ID}" npm run db:init
          DATABASE_URL_UNPOOLED="${TURAS_TEST_DATABASE_URL}" TURAS_ENVIRONMENT_ID="${TURAS_TEST_ENVIRONMENT_ID}" npm run db:roles
          DATABASE_URL="${TURAS_TEST_DATABASE_URL}" TURAS_ENVIRONMENT_ID="${TURAS_TEST_ENVIRONMENT_ID}" npm run db:bootstrap-demo
      - name: Prepare isolated artifact fixtures and images
        run: |
          echo "TURAS_ARTIFACT_STORE_ROOT=${GITHUB_WORKSPACE}/local-artifacts/004/store" >> "$GITHUB_ENV"
          TURAS_ARTIFACT_STORE_ROOT="${GITHUB_WORKSPACE}/local-artifacts/004/store" npm run artifacts:prepare
          npm run artifacts:fixtures
      - name: Validate feature 008 Spec Kit artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/008-engagement-execution
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Complete execution suite manifest
        if: matrix.gate == 'deterministic'
        run: npm run test:execution
      - name: Owned 002–007 regression cohorts
        if: matrix.gate == 'regressions'
        run: npm run test:execution:regressions
      - name: Complete four-project execution UI matrix
        if: matrix.gate == 'webkit'
        run: |
          npx playwright install --with-deps webkit
          npm run execution:ui:check

      - name: Summarize owned startup failures without private output
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const signatures = ['ENOENT', 'EACCES', 'EADDRINUSE', 'ECONNREFUSED', 'EAGAIN',
            'ENOMEM', 'ENOSPC', 'Cannot find module', 'Cannot find package',
            'Module not found', 'TurbopackInternalError', 'panicked at',
            'Resource temporarily unavailable', 'permission denied',
            'JavaScript heap out of memory', 'Database environment marker mismatch',
            'Turas configuration invalid', 'Maintenance unavailable',
            'WORKFLOW', 'SIGKILL', 'thread'];
          for (const feature of ['006', '007', '008']) {
            const log = await readFile(`local-artifacts/${feature}/eval-startup-failure.log`, 'utf8').catch(() => null);
            if (log !== null) console.log(JSON.stringify({ feature, startupFailure: true,
              signatures: signatures.filter(value => log.toLowerCase().includes(value.toLowerCase())) }));
          }
          JS

  product-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        gate: [deterministic, webkit, recovery, benchmark, regressions]
    env:
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Verify pinned vector image
        run: npm run retrieval:prepare -- --offline
      - name: Capture common 012 source fingerprint
        run: |
          node --import tsx --input-type=module <<'JS' >> "$GITHUB_ENV"
          import {featureSourceDigest} from './scripts/execution-source-digest.ts';
          console.log('TURAS_012_EXPECTED_SOURCE_DIGEST='+await featureSourceDigest('012'));
          JS
      - name: Validate 012 design artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/012-product-gap-feedback
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Complete canonical deterministic manifest and types
        if: matrix.gate == 'deterministic'
        run: |
          npm run typecheck:gaps
          npm run test:gaps
          npm run build:gaps:check
          npm run check:docs
      - name: Complete six-journey four-project WebKit matrix
        if: matrix.gate == 'webkit'
        run: |
