      - name: Require complete evidence with the same source fingerprint
        run: node --import tsx scripts/gaps-ci-evidence.ts "${{ matrix.gate }}"

      - name: Bounded redacted failed-test diagnostics
        if: failure()
        run: node --import tsx scripts/print-ci-test-failures.ts

  read-only-mcp:
    needs: scope
    if: ${{ needs.scope.outputs.run_read_only_mcp == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.scope.outputs.matrix_read_only_mcp) }}
    env:
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - run: npm run retrieval:prepare -- --offline
      - name: Capture common 015 source fingerprint
        run: |
          node --import tsx --input-type=module <<'JS' >> "$GITHUB_ENV"
          import {featureSourceDigest} from './scripts/execution-source-digest.ts';
          console.log('TURAS_015_EXPECTED_SOURCE_DIGEST='+await featureSourceDigest('015'));
          JS
      - name: Validate 015 design artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/015-read-only-mcp
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Complete deterministic manifest and types
        if: matrix.gate == 'deterministic'
        run: |
          npm run typecheck:mcp
          npm run test:mcp
          npm run check:docs
      - name: Real pinned SDK consumer acceptance
        if: matrix.gate == 'consumer'
        run: npm run mcp:consumer:check
      - name: Owned web and eve production build
        if: matrix.gate == 'build'
        run: npm run build:mcp:check
      - name: Complete four-project WebKit matrix
        if: matrix.gate == 'webkit'
        run: |
          npx playwright install --with-deps webkit
          npm run mcp:ui:check
      - name: Owned restore, upgrade, restart and interrupted cleanup
        if: matrix.gate == 'recovery'
        run: npm run mcp:recovery:check
      - name: Five quota-paced governed-read classes
        if: matrix.gate == 'benchmark'
        run: npm run benchmark:mcp
      - name: Current domain, native and browser regressions
        if: matrix.gate == 'regressions'
        run: |
          npx playwright install --with-deps webkit
          npm run test:mcp:regressions
      - name: Require complete evidence with the same source fingerprint
        run: node --import tsx scripts/mcp-ci-evidence.ts "${{ matrix.gate }}"

      - name: Bounded redacted failed-test diagnostics
        if: failure()
        run: node --import tsx scripts/print-ci-test-failures.ts

      - name: Retain sanitized predecessor failure stages
        if: failure() && matrix.gate == 'regressions'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-regression-stages-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-artifacts/015/regressions-*/*-failure-diagnostic-private.json
          if-no-files-found: ignore
          retention-days: 1

  legacy-chat:
