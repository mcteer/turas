    env:
      AI_GATEWAY_API_KEY: ''
      VERCEL_OIDC_TOKEN: ''
      CONTEXT_API_KEY: ''
      CONTEXT_DEV_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - run: npm run retrieval:prepare -- --offline
      - run: npx playwright install --with-deps webkit
      - name: Real Eve preference save, recall, caller isolation and removal
        if: matrix.flow == 'text-preferences'
        run: node scripts/check-legacy-parity-disposable.mjs --native-memory --native-files-only
      - name: Real Eve file bytes, customer resolution, corrections and WebKit history
        if: matrix.flow == 'file-corrections'
        run: node scripts/check-legacy-parity-disposable.mjs --native-files-steer-ui --native-files-only
      - name: Real Eve native-file preference save and fresh-session recall, isolation and removal
        if: matrix.flow == 'file-preferences'
        run: node scripts/check-legacy-parity-disposable.mjs --native-memory-files --native-files-only

  pilot-hardening:
    needs: scope
    if: ${{ needs.scope.outputs.run_pilot_hardening == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.scope.outputs.matrix_pilot_hardening) }}
    env:
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
      TURAS_PILOT_CI_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TURAS_PILOT_UI_PREPARATION_FILE: ${{ github.workspace }}/local-artifacts/016/ci-images/preparation.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Validate current pilot design artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/016-pilot-hardening
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Prepare actual owned scanner, parser and renderer images
        run: node --import tsx scripts/prepare-pilot-images.ts --output "${{ github.workspace }}/local-artifacts/016/ci-images"
      - name: Install CLI WebKit dependencies
        run: npx playwright install --with-deps webkit
      - name: Diagnose original evaluation-source cases before the complete catalog
        if: matrix.gate == 'deterministic'
        # This is diagnostic coverage only; the complete catalog still runs all cases.
        run: node --import tsx scripts/check-evaluation-source-preflight.ts
      - name: Complete registered pilot catalog and exact CI evidence
        if: matrix.gate == 'deterministic'
        run: |
          npm run typecheck:pilot
          npm run check:docs
          npm run test:pilot
          npm run mcp:build:check
      - name: Retain complete source-bound pilot CI catalog evidence
        if: matrix.gate == 'deterministic' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-artifacts/016/run-*/ci-*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Retain original owned pilot catalog receipts
        if: matrix.gate == 'deterministic' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-owned-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          # Include the per-gate proof JSON referenced by run.json as well as
          # run/execution/image/suite/process receipts and their CI envelopes.
          path: local-artifacts/016/run-*/*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Complete four-project pilot browser journeys
        if: matrix.gate == 'webkit'
        run: npm run pilot:ui:check
      - name: Complete affected predecessor composition and fresh browser journeys
        if: matrix.gate == 'regressions'
        run: npm run pilot:regressions
      - name: Retain owned production readiness diagnostics
        if: failure() && matrix.gate == 'webkit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-production-readiness-${{ github.run_id }}
          path: |
            local-artifacts/016/startup-*.log
            local-artifacts/016/ui-*/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Bounded redacted failed-test diagnostics
        if: failure()
        run: node --import tsx scripts/print-ci-test-failures.ts

  ci-result:
    if: always()
    needs: [scope, governed-learning, partner-enablement, expansion, expansion-webkit-projects, expansion-webkit-complete, support-deterministic, reporting, verify, execution, execution-webkit-complete, product-gaps, read-only-mcp, legacy-chat, pilot-hardening]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check or verified scope decision
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const needs=JSON.parse(process.env.RESULTS);
          if(needs.scope?.result!=='success')throw Error('CI selection did not succeed');
          const mode=needs.scope.outputs.mode;
          if(!['full','ui','none'].includes(mode))throw Error('Missing explicit CI scope');
          for(const [name,job] of Object.entries(needs)){
            if(name==='scope')continue;
            const selected=needs.scope.outputs['run_'+name.replaceAll('-','_')];
            if(!['true','false'].includes(selected))throw Error('Unmapped CI job: '+name);
            if(job.result!==(selected==='true'?'success':'skipped'))throw Error('Required check did not succeed: '+name);
          }
          console.log('All checks selected for '+mode+' passed. See CI Scope for original execution provenance.');
          JS
