          echo "DATABASE_URL_UNPOOLED=postgres://postgres:postgres@127.0.0.1:5432/turas_support_app_not_selected" >> "$GITHUB_ENV"
      - name: Test every support suite on owned disposable clones
        if: matrix.gate == 'deterministic'
        run: npm run test:support
      - name: Check governed support dispatch through the actual framework
        if: matrix.gate == 'deterministic'
        run: npm run support:native:check
      - name: Check interrupted support dispatch and same-key replay
        if: matrix.gate == 'deterministic'
        run: npm run support:native:check -- --interrupted
      - name: Check preserved support database and workflow restart
        if: matrix.gate == 'deterministic'
        run: npm run support:recovery:check -- --disposable
      - name: Install WebKit
        if: matrix.gate == 'webkit'
        run: npx playwright install --with-deps webkit
      - name: Exercise every support journey in four WebKit projects
        if: matrix.gate == 'webkit'
        run: npm run support:ui:check

      - name: Bounded redacted failed-test diagnostics
        if: failure()
