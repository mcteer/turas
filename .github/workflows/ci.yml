name: Turas checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Owned UI clones reuse module paths across disposable roots; do not reuse
  # cached TSX transforms from another root during startup.
  TSX_DISABLE_CACHE: '1'

concurrency:
  group: turas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.select.outputs.full }}
      mode: ${{ steps.select.outputs.mode }}
      run_governed_learning: ${{ steps.select.outputs.run_governed_learning }}
      matrix_governed_learning: ${{ steps.select.outputs.matrix_governed_learning }}
      run_partner_enablement: ${{ steps.select.outputs.run_partner_enablement }}
      matrix_partner_enablement: ${{ steps.select.outputs.matrix_partner_enablement }}
      run_expansion: ${{ steps.select.outputs.run_expansion }}
      matrix_expansion: ${{ steps.select.outputs.matrix_expansion }}
      run_expansion_webkit_projects: ${{ steps.select.outputs.run_expansion_webkit_projects }}
      matrix_expansion_webkit_projects: ${{ steps.select.outputs.matrix_expansion_webkit_projects }}
      run_expansion_webkit_complete: ${{ steps.select.outputs.run_expansion_webkit_complete }}
      run_support_deterministic: ${{ steps.select.outputs.run_support_deterministic }}
      matrix_support_deterministic: ${{ steps.select.outputs.matrix_support_deterministic }}
      run_reporting: ${{ steps.select.outputs.run_reporting }}
      matrix_reporting: ${{ steps.select.outputs.matrix_reporting }}
      run_verify: ${{ steps.select.outputs.run_verify }}
      run_execution: ${{ steps.select.outputs.run_execution }}
      matrix_execution: ${{ steps.select.outputs.matrix_execution }}
      run_execution_webkit_complete: ${{ steps.select.outputs.run_execution_webkit_complete }}
      run_product_gaps: ${{ steps.select.outputs.run_product_gaps }}
      matrix_product_gaps: ${{ steps.select.outputs.matrix_product_gaps }}
      run_read_only_mcp: ${{ steps.select.outputs.run_read_only_mcp }}
      matrix_read_only_mcp: ${{ steps.select.outputs.matrix_read_only_mcp }}
      run_legacy_chat: ${{ steps.select.outputs.run_legacy_chat }}
      matrix_legacy_chat: ${{ steps.select.outputs.matrix_legacy_chat }}
      run_pilot_hardening: ${{ steps.select.outputs.run_pilot_hardening }}
      matrix_pilot_hardening: ${{ steps.select.outputs.matrix_pilot_hardening }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify CI selection and documentation
        run: |
          node --test .github/ci/change-scope.test.mjs
          node scripts/check-docs.mjs
      - name: Select required runtime checks
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ci/change-scope.mjs

  governed-learning:
    needs: scope
    if: ${{ needs.scope.outputs.run_governed_learning == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.scope.outputs.matrix_governed_learning) }}
    env:
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.gate == 'recovery' && '0' || '1' }}
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Capture common 014 source fingerprint
        run: |
          node --import tsx --input-type=module <<'JS' >> "$GITHUB_ENV"
          import {featureSourceDigest} from './scripts/execution-source-digest.ts';
          console.log('TURAS_014_EXPECTED_SOURCE_DIGEST='+await featureSourceDigest('014'));
          JS
      - name: Validate 014 design artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/014-governed-adaptive-learning
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Complete learning manifest, types, owned build and documentation
        if: matrix.gate == 'deterministic'
        run: |
          npm run typecheck:learning
          npm run test:learning
          npm run build:learning:check
          npm run check:docs
      - name: Complete five journeys across four WebKit projects
        if: matrix.gate == 'webkit'
        run: |
          npx playwright install --with-deps webkit
          npm run learning:ui:check
      - name: Empty and 051 upgrade, interrupted cleanup and preserved restart
        if: matrix.gate == 'recovery'
        run: npm run learning:recovery:check
      - name: Seven load classes with production-quota pacing
        if: matrix.gate == 'benchmark'
        run: npm run benchmark:learning
      - name: Exact earlier delivery and privacy regressions
        if: matrix.gate == 'regressions'
        run: |
          npx playwright install --with-deps webkit
          npm run test:learning:regressions
      - name: Actual eve dispatch and payload retirement with synthetic provider
        if: matrix.gate == 'native'
        run: npm run learning:native:check
      - name: Exercise actual capture runner without paid calls
        if: matrix.gate == 'evaluation-fixture'
        run: npm run eval:learning -- --fixture
      - name: Require complete evidence for the same source
        run: node --import tsx scripts/learning-ci-evidence.ts "${{ matrix.gate }}"

      - name: Bounded redacted failed-test diagnostics
        if: failure()
        run: node --import tsx scripts/print-ci-test-failures.ts
      - name: Retain failed owned learning recovery diagnostics
        if: failure() && matrix.gate == 'recovery'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-learning-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.gate }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            local-artifacts/014/startup-*.log
            local-artifacts/014/runtime-*.log

  partner-enablement:
    needs: scope
    if: ${{ needs.scope.outputs.run_partner_enablement == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.scope.outputs.matrix_partner_enablement) }}
    env:
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.gate == 'recovery' && '0' || '1' }}
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Capture common 013 source fingerprint
        run: |
          node --import tsx --input-type=module <<'JS' >> "$GITHUB_ENV"
          import {featureSourceDigest} from './scripts/execution-source-digest.ts';
          console.log('TURAS_013_EXPECTED_SOURCE_DIGEST='+await featureSourceDigest('013'));
          JS
      - name: Validate 013 design artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/013-partner-enablement
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Complete partner manifest, types, owned build and documentation
        if: matrix.gate == 'deterministic'
        run: |
          npm run typecheck:partners
          npm run test:partners
          npm run build:partners:check
          npm run check:docs
      - name: Complete five journeys across four WebKit projects
        if: matrix.gate == 'webkit'
        run: |
          npx playwright install --with-deps webkit
          npm run partners:ui:check
      - name: Empty and 049 upgrade, interrupted cleanup and preserved restart
        if: matrix.gate == 'recovery'
        run: npm run partners:recovery:check
      - name: Seven load classes with production-quota pacing
        if: matrix.gate == 'benchmark'
        run: npm run benchmark:partners
      - name: Exact earlier delivery and privacy regressions
        if: matrix.gate == 'regressions'
        run: |
          npx playwright install --with-deps webkit
          npm run test:partners:regressions
      - name: Require complete evidence for the same source
        run: node --import tsx scripts/partners-ci-evidence.ts "${{ matrix.gate }}"

      - name: Bounded redacted failed-test diagnostics
        if: failure()
        run: node --import tsx scripts/print-ci-test-failures.ts

  expansion:
    needs: scope
    if: ${{ needs.scope.outputs.run_expansion == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.scope.outputs.matrix_expansion) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      TURAS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      TURAS_ENVIRONMENT_ID: test-ci-expansion
      TURAS_TEST_ENVIRONMENT_ID: test-ci-expansion
      TURAS_APP_ORIGIN: http://127.0.0.1:3000
      TURAS_DEMO_USERNAME: mcteer
      PANEL_USERNAME: panel
      PARTNER_USERNAME: partner
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.gate == 'regressions' && '0' || '1' }}
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Create private synthetic credentials
        run: |
          for key in TURAS_DEMO_PASSWORD PANEL_PASSWORD PARTNER_PASSWORD TURAS_MAINTENANCE_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo "TURAS_ARTIFACT_STORE_ROOT=${GITHUB_WORKSPACE}/local-artifacts/011/source-store" >> "$GITHUB_ENV"
      - name: Initialize marked disposable source
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE turas_test_011_source'
          psql -h 127.0.0.1 -U postgres -c 'CREATE ROLE turas_runtime NOLOGIN'
          npm run db:init
          npm run db:roles
          mkdir -p "$TURAS_ARTIFACT_STORE_ROOT"
          chmod 700 "$TURAS_ARTIFACT_STORE_ROOT"
          node --input-type=module -e 'import {writeFileSync} from "node:fs";writeFileSync(`${process.env.TURAS_ARTIFACT_STORE_ROOT}/.turas-artifact-store.json`,JSON.stringify({environmentId:process.env.TURAS_ENVIRONMENT_ID}),{mode:0o600});'
      - name: Separate application placeholders from the marked test source
        run: |
          echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/turas_expansion_app_not_selected" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=postgres://postgres:postgres@127.0.0.1:5432/turas_expansion_app_not_selected" >> "$GITHUB_ENV"
      - name: Validate feature 011 artifacts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/011-product-expansion
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - name: Complete expansion domain and contract suites
        if: matrix.gate == 'deterministic'
        run: |
          npm run typecheck:expansion
          npm run test:expansion
      - name: Actual framework and interrupted recovery with deterministic provider
        if: matrix.gate == 'native'
        run: |
          npm run expansion:native:check
          npm run expansion:native:check -- --interrupted
      - name: Empty and 045 upgrade, privileges and preserved owned restarts
        if: matrix.gate == 'recovery'
        run: npm run expansion:recovery:check
      - name: Representative expansion performance corpus
        if: matrix.gate == 'benchmark'
        run: npm run benchmark:expansion
      - name: Retain owned expansion benchmark measurements
        if: failure() && matrix.gate == 'benchmark'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expansion-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-artifacts/011/benchmark-*/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Live-capture runner guard fixture without configured-provider calls
        if: matrix.gate == 'evaluation-fixture'
        run: npm run eval:expansion -- --fixture
      - name: Governed earlier privacy, research, plan, execution and support regressions
        if: matrix.gate == 'regressions'
        run: npm run test:expansion:regressions

      - name: Bounded redacted failed-test diagnostics
        if: failure()
        run: node --import tsx scripts/print-ci-test-failures.ts

  expansion-webkit-projects:
    needs: scope
    if: ${{ needs.scope.outputs.run_expansion_webkit_projects == 'true' }}
    name: expansion WebKit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.scope.outputs.matrix_expansion_webkit_projects) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      TURAS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_011_source
      TURAS_ENVIRONMENT_ID: test-ci-expansion
      TURAS_TEST_ENVIRONMENT_ID: test-ci-expansion
      TURAS_APP_ORIGIN: http://127.0.0.1:3000
      TURAS_DEMO_USERNAME: mcteer
      PANEL_USERNAME: panel
      PARTNER_USERNAME: partner
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Create private synthetic credentials
        run: |
          for key in TURAS_DEMO_PASSWORD PANEL_PASSWORD PARTNER_PASSWORD TURAS_MAINTENANCE_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo "TURAS_ARTIFACT_STORE_ROOT=${GITHUB_WORKSPACE}/local-artifacts/011/source-store" >> "$GITHUB_ENV"
      - name: Initialize marked disposable source
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE turas_test_011_source'
          psql -h 127.0.0.1 -U postgres -c 'CREATE ROLE turas_runtime NOLOGIN'
          npm run db:init
          npm run db:roles
          mkdir -p "$TURAS_ARTIFACT_STORE_ROOT"
          chmod 700 "$TURAS_ARTIFACT_STORE_ROOT"
          node --input-type=module -e 'import {writeFileSync} from "node:fs";writeFileSync(`${process.env.TURAS_ARTIFACT_STORE_ROOT}/.turas-artifact-store.json`,JSON.stringify({environmentId:process.env.TURAS_ENVIRONMENT_ID}),{mode:0o600});'
      - name: Separate application placeholders from the marked test source
        run: |
          echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/turas_expansion_app_not_selected" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=postgres://postgres:postgres@127.0.0.1:5432/turas_expansion_app_not_selected" >> "$GITHUB_ENV"
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Complete every expansion journey for this project
        run: npm run expansion:ui:check -- --project "${{ matrix.project }}"
      - name: Retain only safe successful case reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expansion-webkit-${{ github.run_attempt }}-${{ matrix.project }}
          path: local-artifacts/011/ci-webkit-${{ matrix.project }}/*.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
      - name: Bounded redacted failed-test diagnostics
        if: failure()
        run: node --import tsx scripts/print-ci-test-failures.ts

  expansion-webkit-complete:
    name: expansion (webkit)
    if: ${{ always() && needs.scope.outputs.run_expansion_webkit_complete == 'true' }}
    needs: [scope, expansion-webkit-projects]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPANSION_PROJECT_JOBS_RESULT: ${{ needs.expansion-webkit-projects.result }}
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - name: Require every project job to succeed
        run: test "$EXPANSION_PROJECT_JOBS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/artifact-extractor
      - name: Retrieve only this run attempt's complete reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          pattern: expansion-webkit-${{ github.run_attempt }}-*
          path: local-artifacts/011/ci-webkit-input
      - name: Verify the independently discovered four-project case union
        run: node --import tsx scripts/verify-expansion-webkit-ci.ts --input local-artifacts/011/ci-webkit-input

  support-deterministic:
    needs: scope
    if: ${{ needs.scope.outputs.run_support_deterministic == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.scope.outputs.matrix_support_deterministic) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_support
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@127.0.0.1:5432/turas_test_support
      TURAS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/turas_test_support
      TURAS_ENVIRONMENT_ID: test-ci-support
      TURAS_TEST_ENVIRONMENT_ID: test-ci-support
      TURAS_APP_ORIGIN: http://127.0.0.1:3000
      TURAS_DEMO_USERNAME: mcteer
      PANEL_USERNAME: panel
      PARTNER_USERNAME: partner
      AI_GATEWAY_API_KEY: ''
      TURAS_ALLOW_LIVE_MODEL_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bound package repository connection and data waits
        run: |
          sudo install -m 0644 infra/ci/apt.conf /etc/apt/apt.conf.d/99turas-ci-timeouts
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
