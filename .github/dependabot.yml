version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/artifact-extractor"
      - "/report-renderer"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      eve-runtime:
        patterns:
          - eve
          - ai
          - "@vercel/connect"
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
